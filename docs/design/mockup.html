<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GoGreen: mockup</title>
<link rel="stylesheet" href="./tokens.css">
<link rel="stylesheet" href="./components.css">
<style>
  /* Só do mockup: nada daqui vai para o app */
  html { font-size: 100% !important; }
  .mock { padding: 32px 24px 64px; max-width: 1320px; margin-inline: auto; display: flex; flex-direction: column; gap: 40px; }
  .mock__cabeca h1 { font-size: 2rem; font-weight: 800; line-height: 1.1; }
  .mock__cabeca p { max-width: 62ch; margin-top: 8px; color: var(--cor-texto-2); }
  .mock h2.grupo { font-size: 1.375rem; font-weight: 800; margin-bottom: 16px; }
  .grade { display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 390px)); gap: 28px; justify-content: start; align-items: start; }
  .quadro { display: flex; flex-direction: column; min-width: 0; gap: 8px; }
  .quadro > figcaption { font-weight: 700; line-height: 1.2; }
  .quadro > .app { flex: 1; height: auto; min-height: 780px; display: flex; flex-direction: column; border: 2px solid var(--cor-borda-forte); border-radius: 10px; overflow: hidden; }
  .quadro > .app > .app__interno { flex: 1; height: auto; }
  .quadro .app__corpo { overflow: visible; }
  .quadro .folha { max-height: none; }
  .quadro--largo > .app { flex: none; display: block; min-height: 0; height: 720px; }
  .quadro--largo > .app > .app__interno { height: 100%; }
  .quadro--largo .app__corpo { overflow: hidden; }
  .quadro--medio > .app { height: 640px; }
  .quadro--baixo > .app { min-height: 640px; }
  .mapa-falso { position: absolute; inset: 0; width: 100%; height: 100%; z-index: -1; }
  .mapa-falso__nota { position: absolute; left: 6px; top: 6px; max-width: 62%; padding: 2px 6px; background: var(--cor-superficie); font-size: 0.75rem; line-height: 1.25; }
  .local .mapa-falso__nota { display: none; }
  .pos { position: absolute; transform: translate(-50%, -50%); display: block; }
  .pino > .icone { z-index: 1; }
  .estados { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; align-items: start; }
  .estados figure { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .estados figcaption { font-size: var(--fs-peq); font-weight: 700; }
  .toast-demo { position: static; }
  @media (max-width: 480px) {
    .mock { padding: 16px 0 32px; }
    .mock__cabeca, .mock h2.grupo, .quadro > figcaption, .estados { margin-inline: 16px; }
    .grade { grid-template-columns: minmax(0, 1fr); }
    .quadro > .app { border-inline: 0; border-radius: 0; min-height: 700px; }
    .mock__so-desktop { display: none; }
  }
</style>
</head>
<body>
<div class="mock">
  <header class="mock__cabeca">
    <h1>GoGreen: telas principais</h1>
    <p>Mockup estático para a implementação. Lugares, linhas, horários, custos e números são de demonstração. O mapa é um desenho; no app ele é Leaflet + OpenStreetMap.</p>
  </header>

  <section><div class="grade">
    <figure class="quadro "><figcaption>Rotas com resultado e alertas</figcaption>
<div class="app"><div class="app__interno">
  
<header class="topo">
  <a class="logo" href="#" aria-label="GoGreen, início"><svg class="icone" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false" stroke-width="3"><path d="M12 21V4M5 11l7-7 7 7"/></svg>GoGreen</a>
  <span class="topo__espaco"></span>
  <span class="etiqueta-demo">Dados de demonstração</span>
  <button class="botao botao--icone" type="button" data-alternar-tema aria-label="Alternar tema claro e escuro"><svg class="icone" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11z"/></svg></button>
</header>

  <div class="busca__campo"><label class="busca__rotulo" for="o1">De onde</label><input class="busca__input" id="o1" value="Fatec Araçatuba" placeholder="Rua, bairro ou lugar"></div>

  <span class="busca__marca"><svg class="icone" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 22s8-6.8 8-12.5a8 8 0 0 0-16 0C4 15.2 12 22 12 22z" fill="currentColor"/><circle cx="12" cy="9.5" r="2.8" fill="var(--cor-superficie, #fff)" stroke="none"/></svg></span>
  <div class="busca__campo busca__campo--destino"><label class="busca__rotulo" for="d1">Para onde</label><input class="busca__input" id="d1" value="Praça Rui Barbosa" placeholder="Rua, bairro ou lugar"></div>
  <span class="busca__linha"></span>
</form>
  
<div class="opcoes opcoes--grade" role="group" aria-label="Sobre você">
  <label class="opcao"><input type="checkbox"><span class="opcao__caixa"><svg class="icone" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m4.5 12.5 5 5 10-11"/></svg></span>Tenho bike</label>
  <label class="opcao"><input type="checkbox"><span class="opcao__caixa"><svg class="icone" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m4.5 12.5 5 5 10-11"/></svg></span>Tenho carro</label>
  <label class="opcao opcao--inteira"><input type="checkbox"><span class="opcao__caixa"><svg class="icone" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m4.5 12.5 5 5 10-11"/></svg></span>Rota acessível: evita calçada ruim e falta de rampa</label>
</div>
  <div class="resultado-cabeca"><h2 class="secao-titulo">Fatec Araçatuba até Praça Rui Barbosa</h2><p class="texto-2 texto-peq">Hoje às 19:20, à noite. 1,0 km.</p></div>
  
<div class="conjunto-placa">

    <div class="cartao-rota__acoes"><a class="botao botao--texto" href="#">Ver caminho</a></div>
